<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Tour Guide — Planner</title>
  <style>
    :root{--bg:#f0f8ff}
    body { font-family: Inter, Arial, sans-serif; margin:16px; background:var(--bg); color:#122; -webkit-font-smoothing:antialiased }
    .card { max-width:920px; margin:18px auto; padding:20px; border-radius:14px; background: rgba(255,255,255,0.65); box-shadow:0 6px 18px rgba(16,24,40,0.06); backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.6) }
    h1 { margin:0 0 8px; font-size:20px }
    label { display:block; margin:12px 0 6px; font-weight:600 }
    select, input[type="number"] { padding:10px; width:100%; box-sizing:border-box; border-radius:8px; border:1px solid rgba(0,0,0,0.06); background:rgba(255,255,255,0.9) }
    .controls { display:flex; gap:12px; align-items:end }
    .col { flex:1 }
    .btn { background:#2ecc71; color:white; border:none; padding:11px 14px; border-radius:10px; cursor:pointer; font-weight:700 }
    .btn:hover { filter:brightness(.95) }
    .error { color:#c0392b; margin-top:8px }
    @media (max-width:700px){ .controls{flex-direction:column} .card{margin:12px} }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Tour Guide — Smart Trip Planner</h1>
    <form method="post" action="{{ url_for('plan') }}">
      <label for="start">Start country</label>
      <select id="start" name="start">
        {% for c in countries %}
          <option value="{{ c['alpha3Code'] }}">{{ c['name'] }}</option>
        {% endfor %}
      </select>

      <label for="names">Or enter multiple countries (comma-separated)</label>
      <input id="names" name="names" type="text" placeholder="Pakistan, Turkey, Greece">

      <div class="controls" style="margin-top:12px">
        <div class="col">
          <label for="count">Number of countries in route</label>
          <select id="count" name="count">
            <option>1</option>
            <option selected>3</option>
            <option>2</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>
        <div style="flex:0 0 160px">
          <button class="btn" type="submit">Plan My Trip</button>
        </div>
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
    </form>
  </div>
</body>
</html>
